<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Memory</title>
  <!--
    THESIS: The agent has learned 104 things and the existing Memory screen shows
      none of them — it renders three markdown files. This surface answers what
      the agent actually knows, what those things are about, and which of them
      are load-bearing. Nothing else earns space.
    OWN-WORLD: Same control room as the Capability Router console, deliberately:
      an operator should not learn two visual languages for one agent. Colour
      means state and nothing else; structure comes from hairlines and space.
    STORY: The constellation first — you see the shape of the knowledge and its
      clusters. Click a node and it becomes the subject: its content, its trust,
      what it is about, what it connects to and why. Search narrows the
      constellation rather than replacing it with a list.
    FIRST VIEWPORT: The graph, at full width, already drawn. No empty canvas
      waiting for a click, no legend explaining the legend.
    FORM: Single self-contained file. Force layout and rendering are hand-written
      over SVG — a chart library would be more code than the ~200 lines this
      needs, and none of it inspectable.
  -->
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #101013;
      --surface-raised: #15151a;
      --surface-hover: #1c1c23;
      --line: #212127;
      --line-strong: #33333d;
      --text: #f3f3f6;
      --muted: #9a9aa8;
      --faint: #61616e;
      --accent: #f3f3f6;
      --green: #4ade9b;
      --amber: #f7b955;
      --red: #ff6b7d;
      --violet: #b490ff;
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --t-label: 10.5px;
      --t-body: 13px;
      --t-value: 16px;
      --t-head: 20px;
      --focus: 0 0 0 3px rgba(243, 243, 246, .22);
      --radius: 7px;        /* the shared pair — see hermes-panel.css */
      --radius-input: 9px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font: var(--t-body)/1.5 var(--sans);
      -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    h2 { margin: 0; font: 600 var(--t-head)/1.25 var(--sans); letter-spacing: -.015em; }
    p { margin: 0; }
    [hidden] { display: none !important; }

    .shell { display: flex; flex-direction: column; height: 100%; }

    /* ── Masthead ──────────────────────────────────────────────────── */
    .bar {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center; gap: 10px 20px;
      padding: 11px clamp(16px, 2.4vw, 28px);
      border-bottom: 1px solid var(--line);
    }
    @media (max-width: 760px) {
      .bar { grid-template-columns: auto minmax(0, 1fr); }
      .search { grid-column: 1 / -1; grid-row: 2; max-width: none; }
    }
    .brand { display: flex; align-items: baseline; gap: 9px; }
    .brand-name { font: 600 var(--t-label) var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    /* Same wordmark form as the router console and the office: the surface at
       full contrast, the product faint beside it. */
    .brand-host { color: var(--faint); font: var(--t-label)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    @media (max-width: 560px) { .brand-host { display: none; } }
    .search {
      width: 100%; max-width: 420px; padding: 6px 12px;
      border: 1px solid var(--line); border-radius: var(--radius-input);
      background: var(--surface); font: var(--t-body) var(--mono);
    }
    .search::placeholder { color: var(--faint); }
    .facts { display: flex; gap: 18px; align-items: baseline; }
    .fact { display: flex; flex-direction: column; }
    .fact-label { color: var(--faint); font: var(--t-label) var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    .fact-value { font: 500 var(--t-value) var(--mono); }

    /* ── Stage ─────────────────────────────────────────────────────── */
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; flex: 1; }
    @media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
    .canvas { position: relative; min-height: 0; overflow: hidden; }
    #graph { display: block; width: 100%; height: 100%; cursor: grab; }
    #graph.dragging { cursor: grabbing; }

    /* Nodes: a fact is a disc sized by how connected it is, an entity is a
       diamond. Shape carries kind so colour stays free to carry state. */
    .node { cursor: pointer; }
    .n-fact { fill: #2a2a34; stroke: var(--line-strong); stroke-width: 1; }
    .n-entity { fill: none; stroke: var(--violet); stroke-width: 1.2; }
    .node:hover .n-fact { stroke: var(--accent); }
    .node.on .n-fact { fill: var(--accent); stroke: var(--accent); }
    .node.on .n-entity { stroke: var(--accent); stroke-width: 2; }
    .node.near .n-fact { stroke: var(--accent); stroke-width: 1.6; }
    .node.dim { opacity: .18; }
    /* Trust is the one thing worth colouring: a fact the agent half-believes
       should not look identical to one it is sure of. */
    .node.t-low .n-fact { fill: #3a2b30; stroke: var(--red); }
    .node.t-mid .n-fact { fill: #34302a; stroke: var(--amber); }
    .node.t-high .n-fact { stroke: var(--green); }
    .n-label {
      fill: var(--muted); font: var(--t-label) var(--mono); pointer-events: none;
      paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    }
    .node.on .n-label, .node.near .n-label { fill: var(--text); }
    .edge { stroke: var(--line-strong); fill: none; }
    .edge.mentions { stroke-dasharray: 2 3; opacity: .5; }
    .edge.on { stroke: var(--accent); opacity: 1; }
    .edge.dim { opacity: .07; }

    .hint {
      position: absolute; left: 16px; bottom: 14px;
      color: var(--faint); font: var(--t-label) var(--mono); letter-spacing: .04em;
    }
    .zoom { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; }
    .zoom button {
      width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: var(--radius);
      background: var(--surface); color: var(--muted); line-height: 1;
    }
    .zoom button:hover { color: var(--text); border-color: var(--accent); }

    /* ── Inspector ─────────────────────────────────────────────────── */
    .side {
      border-left: 1px solid var(--line); padding: 20px clamp(14px, 1.6vw, 20px);
      overflow: auto; min-height: 0;
    }
    @media (max-width: 900px) { .side { border-left: 0; border-top: 1px solid var(--line); } }
    .subject { font: 500 var(--t-value)/1.45 var(--sans); overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 14px; }
    .kicker {
      color: var(--faint); font: 600 var(--t-label) var(--mono);
      letter-spacing: .16em; text-transform: uppercase;
    }
    .group { margin-top: 26px; }
    .group > .kicker { display: block; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
    .item {
      display: block; width: 100%; padding: 9px 0; border: 0; border-bottom: 1px solid var(--line);
      background: none; text-align: left; color: inherit;
    }
    .item:last-child { border-bottom: 0; }
    .item:hover { background: var(--surface-hover); }
    .item-line { overflow-wrap: anywhere; }
    .item-why { color: var(--faint); font: var(--t-label) var(--mono); margin-top: 3px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag {
      padding: 2px 8px; border: 1px solid var(--line-strong); border-radius: 999px;
      color: var(--muted); font: var(--t-label) var(--mono);
    }
    .nothing { color: var(--faint); padding: 4px 0; }
    .trust-bar { height: 3px; margin-top: 6px; border-radius: 2px; background: var(--line); }
    .trust-fill { height: 100%; border-radius: 2px; background: var(--green); }
    /* Same convention as the router console: a condition worth an operator's
       attention is a line with a state dot, not a tinted card. The dot is the
       signal that already means "state" in the masthead, so there is one visual
       language for it across the panels. */
    .warn {
      display: flex; gap: 10px; align-items: baseline;
      margin: 0 clamp(16px, 2.4vw, 28px); padding: 11px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted); font-size: var(--t-body);
    }
    .warn::before { content: ""; flex: 0 0 auto; width: 6px; height: 6px; margin-top: 6px;
      border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgba(247, 185, 85, .12); }
    .warn strong { color: var(--text); }
    .warn.bad::before { background: var(--red); box-shadow: 0 0 0 3px rgba(255, 107, 125, .12); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <span class="brand"><span class="brand-name">Memory</span> <span class="brand-host">Hermes One</span></span>
      <input id="search" class="search" type="search" autocomplete="off"
             placeholder="Search what the agent knows" aria-label="Search memories">
      <div class="facts" id="counts"></div>
    </header>
    <div id="warning"></div>
    <div class="stage">
      <div class="canvas">
        <svg id="graph" role="img" aria-label="Memory graph"></svg>
        <p class="hint" id="hint"></p>
        <div class="zoom">
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button id="zoomFit" type="button" aria-label="Fit graph">⤢</button>
        </div>
      </div>
      <aside class="side" id="side" aria-live="polite"></aside>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const SIDECAR = '/api/extensions/memory-graph/sidecar';

      const state = {
        facts: [], entities: [], edges: [], stats: null,
        nodes: [], links: [], byId: new Map(),
        selected: null, query: '', loading: true, error: null,
        view: { x: 0, y: 0, k: 1 },
      };

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = String(text);
        return n;
      };
      const svgEl = (tag, attrs) => {
        const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
        if (attrs) for (const k of Object.keys(attrs)) n.setAttribute(k, String(attrs[k]));
        return n;
      };
      const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

      const csrf = () => {
        try {
          const own = (window.__HERMES_CONFIG__ || {}).csrfToken;
          if (own) return own;
          return (window.parent.__HERMES_CONFIG__ || {}).csrfToken || '';
        } catch (_) { return ''; }
      };

      async function call(path) {
        const res = await fetch(`${SIDECAR}${path}`, { credentials: 'same-origin' });
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch (_) { data = { raw }; }
        return { ok: res.ok, status: res.status, data };
      }

      // ── model ────────────────────────────────────────────────────────
      // A fact's key id space and an entity's overlap (both start at 1), so the
      // graph namespaces them. Conflating the two would silently wire a fact to
      // the wrong neighbour.
      const factKey = (id) => `f${id}`;
      const entityKey = (id) => `e${id}`;

      function trustBand(trust) {
        if (trust < 0.45) return 't-low';
        if (trust < 0.7) return 't-mid';
        return 't-high';
      }

      function buildModel() {
        const nodes = [];
        const byId = new Map();
        const degree = new Map();
        state.edges.forEach((e) => {
          if (e.kind !== 'shares') return;
          degree.set(factKey(e.source), (degree.get(factKey(e.source)) || 0) + 1);
          degree.set(factKey(e.target), (degree.get(factKey(e.target)) || 0) + 1);
        });

        state.facts.forEach((f) => {
          const node = {
            key: factKey(f.id), kind: 'fact', id: f.id, label: shortLabel(f.content),
            fact: f, degree: degree.get(factKey(f.id)) || 0,
          };
          nodes.push(node); byId.set(node.key, node);
        });
        state.entities.forEach((e) => {
          const node = { key: entityKey(e.id), kind: 'entity', id: e.id, label: e.name, entity: e };
          nodes.push(node); byId.set(node.key, node);
        });

        const links = [];
        state.edges.forEach((e) => {
          const a = e.kind === 'shares' ? factKey(e.source) : factKey(e.source);
          const b = e.kind === 'shares' ? factKey(e.target) : entityKey(e.target);
          const from = byId.get(a), to = byId.get(b);
          if (from && to) links.push({ kind: e.kind, from, to, weight: e.weight || 1, via: e.via || [] });
        });

        state.nodes = nodes;
        state.links = links;
        state.byId = byId;
      }

      function shortLabel(text) {
        const s = String(text || '').replace(/\s+/g, ' ').trim();
        return s.length > 34 ? `${s.slice(0, 33)}…` : s;
      }

      // ── layout ───────────────────────────────────────────────────────
      // A small force simulation, run to completion before the first paint so the
      // operator never watches nodes fly around. 104 nodes converge in well under
      // a frame budget; nothing here needs to be incremental.
      function layout(width, height) {
        const nodes = state.nodes;
        if (!nodes.length) return;
        const n = nodes.length;
        // Deterministic ring seed: no Math.random, so the same memory always
        // produces the same map and an operator can build spatial familiarity.
        nodes.forEach((node, i) => {
          const angle = (i / n) * Math.PI * 2;
          const radius = Math.max(width, height) * (node.kind === 'entity' ? 0.62 : 0.4);
          node.x = width / 2 + Math.cos(angle) * radius;
          node.y = height / 2 + Math.sin(angle) * radius;
          node.vx = 0; node.vy = 0;
        });

        // Spacing is driven by node count, not by the viewport: packing 213
        // nodes into 900x560 guarantees overlap. Lay out roomy, then fit().
        const ideal = Math.max(46, 1400 / Math.sqrt(n) * 2.2);
        for (let step = 0; step < 420; step++) {
          const cool = 1 - step / 420;
          // Repulsion, O(n²) — at 104 nodes that is ~11k pairs per step, which is
          // cheap and exact; a quadtree would add code for no gain at this size.
          for (let i = 0; i < n; i++) {
            const a = nodes[i];
            for (let j = i + 1; j < n; j++) {
              const b = nodes[j];
              let dx = a.x - b.x, dy = a.y - b.y;
              let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
              if (dist > ideal * 4) continue;
              const force = (ideal * ideal) / (dist * dist) * cool * 0.6;
              dx /= dist; dy /= dist;
              a.vx += dx * force; a.vy += dy * force;
              b.vx -= dx * force; b.vy -= dy * force;
            }
          }
          // Attraction along edges; a heavier edge pulls harder, so facts that
          // share more entities end up visibly closer.
          state.links.forEach((link) => {
            const a = link.from, b = link.to;
            let dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const pull = (dist - ideal) / dist * cool * (link.kind === 'shares' ? 0.09 * Math.min(link.weight, 3) : 0.05);
            dx *= pull; dy *= pull;
            a.vx += dx; a.vy += dy;
            b.vx -= dx; b.vy -= dy;
          });
          // Gentle centring keeps disconnected islands on screen instead of
          // letting repulsion push them past the viewport forever.
          nodes.forEach((node) => {
            node.vx += (width / 2 - node.x) * 0.0016;
            node.vy += (height / 2 - node.y) * 0.0016;
            node.x += Math.max(-18, Math.min(18, node.vx));
            node.y += Math.max(-18, Math.min(18, node.vy));
            node.vx *= 0.82; node.vy *= 0.82;
          });
        }
      }

      function fit(width, height) {
        const nodes = state.nodes;
        if (!nodes.length) { state.view = { x: 0, y: 0, k: 1 }; return; }
        // Measure the live box: this runs inside a host panel whose size is not
        // known when the script first executes, and fitting to a stale width
        // leaves the graph as a clump in the middle of an empty canvas.
        const box = $('graph').getBoundingClientRect();
        if (box.width > 40) { width = box.width; height = box.height; }
        const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const pad = 54;
        const k = Math.min(
          (width - pad * 2) / Math.max(1, maxX - minX),
          (height - pad * 2) / Math.max(1, maxY - minY),
          1.7,
        );
        state.view = {
          k,
          x: (width - (maxX + minX) * k) / 2,
          y: (height - (maxY + minY) * k) / 2,
        };
      }

      // ── focus ────────────────────────────────────────────────────────
      function neighbours(key) {
        const near = new Set();
        state.links.forEach((link) => {
          if (link.from.key === key) near.add(link.to.key);
          if (link.to.key === key) near.add(link.from.key);
        });
        return near;
      }

      function matches(node, q) {
        if (!q) return true;
        if (node.kind === 'entity') {
          return node.entity.name.toLowerCase().includes(q)
            || node.entity.aliases.some((a) => a.toLowerCase().includes(q));
        }
        const f = node.fact;
        return [f.content, f.category, ...(f.tags || [])]
          .some((v) => String(v || '').toLowerCase().includes(q));
      }

      // ── render ───────────────────────────────────────────────────────
      function draw() {
        const svg = $('graph');
        const box = svg.getBoundingClientRect();
        const width = Math.max(320, box.width || 900);
        const height = Math.max(260, box.height || 560);
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        clear(svg);

        const q = state.query.trim().toLowerCase();
        const hits = q ? new Set(state.nodes.filter((n) => matches(n, q)).map((n) => n.key)) : null;
        const near = state.selected ? neighbours(state.selected) : null;

        const root = svgEl('g', {
          transform: `translate(${state.view.x} ${state.view.y}) scale(${state.view.k})`,
        });
        svg.appendChild(root);

        const edgeLayer = svgEl('g');
        root.appendChild(edgeLayer);
        state.links.forEach((link) => {
          const on = state.selected
            && (link.from.key === state.selected || link.to.key === state.selected);
          const faded = (state.selected && !on)
            || (hits && !(hits.has(link.from.key) && hits.has(link.to.key)));
          const line = svgEl('line', {
            class: `edge ${link.kind}${on ? ' on' : ''}${faded ? ' dim' : ''}`,
            x1: link.from.x, y1: link.from.y, x2: link.to.x, y2: link.to.y,
            'stroke-width': link.kind === 'shares' ? Math.min(1 + link.weight * 0.5, 3) : 1,
          });
          edgeLayer.appendChild(line);
        });

        // Claimed label boxes, in screen space, so a label is only drawn where it
        // can actually be read. Rank decides priority; geometry decides fit.
        const claimed = [];
        const fits = (node, chars) => {
          const w = chars * 5.6 + 12, h = 12;
          const x = node.x * state.view.k + state.view.x + 11;
          const y = node.y * state.view.k + state.view.y - 6;
          const box = { x, y, w, h };
          const hit = claimed.some((c) => x < c.x + c.w && c.x < x + box.w
            && y < c.y + c.h && c.y < y + box.h);
          if (hit) return false;
          claimed.push(box);
          return true;
        };

        // Draw in priority order so the most important label wins the space.
        const order = [...state.nodes].sort((a, b) => {
          const rank = (n) => (n.key === state.selected ? 3 : 0)
            + (n.kind === 'entity' ? (n.entity.facts >= 4 ? 2 : 0) : (n.degree >= 10 ? 2 : 0));
          return rank(b) - rank(a);
        });

        order.forEach((node) => {
          const isSelected = node.key === state.selected;
          const isNear = !!(near && near.has(node.key));
          const faded = (hits && !hits.has(node.key)) || (state.selected && !isSelected && !isNear);
          const classes = ['node'];
          if (isSelected) classes.push('on');
          if (isNear) classes.push('near');
          if (faded) classes.push('dim');
          if (node.kind === 'fact') classes.push(trustBand(node.fact.trust));

          const g = svgEl('g', { class: classes.join(' '), transform: `translate(${node.x} ${node.y})` });
          g.dataset.key = node.key;
          if (node.kind === 'fact') {
            // Radius grows with connections: the load-bearing knowledge should
            // read as bigger without needing a legend.
            const r = 4.5 + Math.min(node.degree, 12) * 0.7;
            g.appendChild(svgEl('circle', { class: 'n-fact', r }));
          } else {
            const s = 5 + Math.min(node.entity.facts, 10) * 0.5;
            g.appendChild(svgEl('rect', {
              class: 'n-entity', x: -s, y: -s, width: s * 2, height: s * 2,
              transform: 'rotate(45)', rx: 1.5,
            }));
          }
          // Labels only where they can be read: everything at once is noise.
          // At rest only the landmarks are named: 213 labels at once is an
          // unreadable mat of overlapping text, which is worse than none. Focus,
          // search and hover are what reveal the others.
          const isLandmark = node.kind === 'entity'
            ? node.entity.facts >= 4
            : node.degree >= 10;
          // With a big focus group, labelling every neighbour is noise. Keep the
          // selection and the landmarks; the rest are identified by clicking.
          const crowded = near && near.size > 12;
          const wants = isSelected || isLandmark
            || (isNear && !crowded)
            || (hits && hits.has(node.key) && hits.size <= 30);
          const labelled = wants && fits(node, node.label.length);
          if (labelled) {
            const text = svgEl('text', { class: 'n-label', x: 11, y: 3.5 });
            text.textContent = node.label;
            g.appendChild(text);
          }
          g.addEventListener('click', (event) => { event.stopPropagation(); select(node.key); });
          root.appendChild(g);
        });

        $('hint').textContent = state.nodes.length
          ? 'drag to pan · scroll to zoom · click a node'
          : '';
      }

      function renderCounts() {
        const box = $('counts');
        clear(box);
        const s = state.stats;
        if (!s) return;
        const add = (label, value) => {
          const f = el('div', 'fact');
          f.append(el('span', 'fact-label', label), el('span', 'fact-value', value));
          box.append(f);
        };
        add('facts', s.facts);
        add('topics', s.entities);
        add('links', s.shares);
        // Facts nothing was extracted from cannot be reached by topic — a real
        // finding, so it is stated rather than left to be noticed.
        if (s.isolated) add('unlinked', s.isolated);
      }

      function renderWarning() {
        const box = $('warning');
        clear(box);
        if (state.error) {
          const line = el('div', 'warn bad');
          line.append(el('strong', '', 'Memory unavailable. '), el('span', '', state.error));
          box.append(line);
          return;
        }
        if (!state.loading && state.stats && state.stats.isolated) {
          const line = el('div', 'warn');
          line.append(
            el('strong', '', `${state.stats.isolated} facts have no topic. `),
            el('span', '', 'Topic-based recall cannot reach them, so they are effectively write-only.'),
          );
          box.append(line);
        }
      }

      function renderSide() {
        const box = $('side');
        clear(box);
        if (state.loading) { box.append(el('p', 'nothing', 'Loading…')); return; }
        if (!state.selected) {
          box.append(el('span', 'kicker', 'The constellation'));
          const s = state.stats || {};
          const p = el('p', 'subject', s.facts
            ? `${s.facts} things the agent knows, about ${s.entities} topics.`
            : 'Nothing recorded yet.');
          box.append(p);
          if (s.facts) {
            box.append(el('p', 'item-why',
              'Discs are facts, sized by how connected they are; diamonds are topics. '
              + 'A solid line means two facts share a topic — click one to see which.'));
          }
          const strong = [...state.nodes]
            .filter((n) => n.kind === 'fact')
            .sort((a, b) => b.degree - a.degree)
            .slice(0, 5);
          if (strong.length) {
            const group = el('div', 'group');
            group.append(el('span', 'kicker', 'Most connected'));
            strong.forEach((node) => {
              const item = el('button', 'item');
              item.type = 'button';
              item.append(el('div', 'item-line', shortLabel(node.fact.content)));
              item.append(el('div', 'item-why', `${node.degree} links · ${node.fact.category}`));
              item.addEventListener('click', () => select(node.key));
              group.append(item);
            });
            box.append(group);
          }
          return;
        }

        const node = state.byId.get(state.selected);
        if (!node) return;

        if (node.kind === 'entity') {
          box.append(el('span', 'kicker', 'Topic'));
          box.append(el('p', 'subject', node.entity.name));
          if (node.entity.aliases.length) {
            const tags = el('div', 'tags');
            node.entity.aliases.forEach((a) => tags.append(el('span', 'tag', a)));
            box.append(tags);
          }
          const group = el('div', 'group');
          group.append(el('span', 'kicker', `${node.entity.facts} facts`));
          state.facts
            .filter((f) => (f.entities || []).includes(node.id))
            .forEach((f) => {
              const item = el('button', 'item');
              item.type = 'button';
              item.append(el('div', 'item-line', f.content));
              item.append(el('div', 'item-why', `${f.category} · trust ${f.trust}`));
              item.addEventListener('click', () => select(factKey(f.id)));
              group.append(item);
            });
          box.append(group);
          return;
        }

        const f = node.fact;
        box.append(el('span', 'kicker', f.category));
        box.append(el('p', 'subject', f.content));

        const bar = el('div', 'trust-bar');
        const fill = el('div', 'trust-fill');
        fill.style.width = `${Math.round(f.trust * 100)}%`;
        if (f.trust < 0.45) fill.style.background = 'var(--red)';
        else if (f.trust < 0.7) fill.style.background = 'var(--amber)';
        bar.append(fill);
        box.append(bar);

        const meta = el('div', 'meta');
        const add = (label, value) => {
          const f2 = el('div', 'fact');
          f2.append(el('span', 'fact-label', label), el('span', 'fact-value', value));
          meta.append(f2);
        };
        add('trust', f.trust);
        add('helpful', f.helpful);
        // retrieval_count is not incremented by the live retrieval path in this
        // deploy, so it is labelled for what it is rather than presented as usage.
        add('recorded uses', f.retrievals);
        box.append(meta);
        box.append(el('p', 'item-why', `learned ${f.created_at || '—'}`));

        if (f.tags.length) {
          const tags = el('div', 'tags');
          f.tags.forEach((t) => tags.append(el('span', 'tag', t)));
          box.append(tags);
        }

        const topics = state.entities.filter((e) => (f.entities || []).includes(e.id));
        if (topics.length) {
          const group = el('div', 'group');
          group.append(el('span', 'kicker', 'About'));
          topics.forEach((e) => {
            const item = el('button', 'item');
            item.type = 'button';
            item.append(el('div', 'item-line', e.name));
            item.append(el('div', 'item-why', `${e.facts} facts`));
            item.addEventListener('click', () => select(entityKey(e.id)));
            group.append(item);
          });
          box.append(group);
        }

        const related = state.links
          .filter((l) => l.kind === 'shares' && (l.from.key === node.key || l.to.key === node.key))
          .map((l) => ({ other: l.from.key === node.key ? l.to : l.from, via: l.via, weight: l.weight }))
          .sort((a, b) => b.weight - a.weight);
        const group = el('div', 'group');
        group.append(el('span', 'kicker', related.length ? `Related · ${related.length}` : 'Related'));
        if (!related.length) {
          group.append(el('p', 'nothing', topics.length
            ? 'No other fact shares a topic with this one.'
            : 'No topic was extracted from this fact, so nothing can relate to it.'));
        }
        related.forEach((rel) => {
          const item = el('button', 'item');
          item.type = 'button';
          item.append(el('div', 'item-line', rel.other.fact ? rel.other.fact.content : rel.other.label));
          // Every relationship states its evidence: the operator never has to
          // trust the layout.
          item.append(el('div', 'item-why', `shares ${rel.via.join(', ')}`));
          item.addEventListener('click', () => select(rel.other.key));
          group.append(item);
        });
        box.append(group);
      }

      function select(key) {
        const opening = state.selected !== key;
        state.selected = opening ? key : null;
        if (opening) centreOn(key); else fitAll();
        draw();
        renderSide();
      }

      // Focus means "show me this and what it touches", so the view frames the
      // node and its neighbours rather than leaving the operator to hunt for a
      // highlighted dot somewhere on the canvas.
      function centreOn(key) {
        const node = state.byId.get(key);
        if (!node) return;
        const near = neighbours(key);
        const group = [node, ...state.nodes.filter((n) => near.has(n.key))];
        const box = $('graph').getBoundingClientRect();
        const width = box.width || 900, height = box.height || 560;
        const xs = group.map((n) => n.x), ys = group.map((n) => n.y);
        const spanX = Math.max(1, Math.max(...xs) - Math.min(...xs));
        const spanY = Math.max(1, Math.max(...ys) - Math.min(...ys));
        // Cap the zoom by how many nodes are in view. A 29-fact hub used to scale
        // to 2.2x, which crammed 30 nodes into the middle and turned their labels
        // into an unreadable mat of overlapping text.
        const crowdCap = group.length > 20 ? 0.85 : group.length > 10 ? 1.2 : 2.2;
        const k = Math.max(0.3, Math.min((width - 260) / spanX, (height - 160) / spanY, crowdCap));
        state.view = {
          k,
          x: width / 2 - (Math.max(...xs) + Math.min(...xs)) / 2 * k,
          y: height / 2 - (Math.max(...ys) + Math.min(...ys)) / 2 * k,
        };
      }

      function fitAll() {
        const box = $('graph').getBoundingClientRect();
        fit(box.width || 900, box.height || 560);
      }

      function renderAll() {
        renderCounts();
        renderWarning();
        draw();
        renderSide();
      }

      // ── interaction ──────────────────────────────────────────────────
      function wire() {
        const svg = $('graph');
        let dragging = false, lastX = 0, lastY = 0;
        svg.addEventListener('mousedown', (e) => {
          dragging = true; lastX = e.clientX; lastY = e.clientY;
          svg.classList.add('dragging');
        });
        window.addEventListener('mouseup', () => { dragging = false; svg.classList.remove('dragging'); });
        window.addEventListener('mousemove', (e) => {
          if (!dragging) return;
          state.view.x += e.clientX - lastX;
          state.view.y += e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          draw();
        });
        svg.addEventListener('wheel', (e) => {
          e.preventDefault();
          zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.offsetX, e.offsetY);
        }, { passive: false });
        svg.addEventListener('click', () => { if (state.selected) select(state.selected); });

        $('zoomIn').addEventListener('click', () => zoomAt(1.2));
        $('zoomOut').addEventListener('click', () => zoomAt(1 / 1.2));
        $('zoomFit').addEventListener('click', () => { fitAll(); draw(); });
        $('search').addEventListener('input', (e) => {
          state.query = e.target.value;
          draw();
        });
        // Escape clears the focus: an operator must always have one key that
        // returns them to the whole picture.
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && state.selected) select(state.selected);
        });
        window.addEventListener('resize', () => {
          const box = svg.getBoundingClientRect();
          layout(box.width || 900, box.height || 560);
          fit(box.width || 900, box.height || 560);
          draw();
        });
      }

      function zoomAt(factor, ox, oy) {
        const svg = $('graph');
        const box = svg.getBoundingClientRect();
        const cx = ox === undefined ? (box.width || 900) / 2 : ox;
        const cy = oy === undefined ? (box.height || 560) / 2 : oy;
        const k = Math.max(0.25, Math.min(4, state.view.k * factor));
        // Keep the point under the cursor fixed while scaling.
        state.view.x = cx - (cx - state.view.x) * (k / state.view.k);
        state.view.y = cy - (cy - state.view.y) * (k / state.view.k);
        state.view.k = k;
        draw();
      }

      async function load() {
        const res = await call('/graph');
        if (!res.ok) {
          state.loading = false;
          state.error = (res.data && res.data.error) || `HTTP ${res.status}`;
          renderAll();
          return;
        }
        const d = res.data || {};
        state.facts = d.facts || [];
        state.entities = d.entities || [];
        state.edges = d.edges || [];
        state.stats = d.stats || null;
        state.error = null;
        state.loading = false;
        buildModel();
        const box = $('graph').getBoundingClientRect();
        layout(box.width || 900, box.height || 560);
        fitAll();
        renderAll();
      }

      globalThis.__memory = {
        state, buildModel, layout, fit, fitAll, centreOn, draw, select, renderSide, renderCounts,
        renderWarning, matches, neighbours, trustBand, shortLabel, factKey,
        entityKey, zoomAt, csrf, call, load,
      };

      wire();
      renderAll();
      load();
    })();
  </script>
</body>
</html>
