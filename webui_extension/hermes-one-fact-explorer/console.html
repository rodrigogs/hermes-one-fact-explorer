              // them stays put — the behaviour every map has.
              zoomTo(pinch.k * (distance / pinch.distance), pinch.x, pinch.y);
            }
            return;
          }
          if (!panning) return;
          const dx = event.clientX - lastX, dy = event.clientY - lastY;
          moved += Math.abs(dx) + Math.abs(dy);
          state.view.x += dx;
          state.view.y += dy;
          lastX = event.clientX; lastY = event.clientY;
          draw();
        });

        const endPointer = (event) => {
          const wasPanning = panning;
          touches.delete(event.pointerId);
          if (touches.size < 2) pinch = null;
          if (touches.size === 0) {
            panning = false;
            svg.classList.remove('dragging');
            // A tap on empty canvas clears the focus; a drag must not. 8px of
            // slop, because a finger never holds perfectly still.
            if (wasPanning && moved < 8 && state.selected) select(state.selected);
          } else if (wasPanning) {
            // One finger lifted from a pinch: re-anchor the remaining one so the
            // graph does not jump.
            const [remaining] = [...touches.values()];
            lastX = remaining.x; lastY = remaining.y;
          }
        };
        svg.addEventListener('pointerup', endPointer);
        svg.addEventListener('pointercancel', endPointer);

        svg.addEventListener('wheel', (event) => {
          event.preventDefault();
          const point = localPoint(event);
          zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12, point.x, point.y);
        }, { passive: false });

        $('zoomIn').addEventListener('click', () => zoomAt(1.2));
        $('zoomOut').addEventListener('click', () => zoomAt(1 / 1.2));
        $('zoomFit').addEventListener('click', () => { fitAll(); draw(); });
        $('graphScope').addEventListener('click', () => {
          setGraphTopics(state.graphTopics === 'linking' ? 'all' : 'linking');
        });
        $('modeList').addEventListener('click', () => setMode('list'));
        $('modeGraph').addEventListener('click', () => setMode('graph'));
        $('sort').addEventListener('change', (e) => {
          state.sort = e.target.value;
          renderList(); markCurrent();
        });
        $('search').addEventListener('input', (e) => {
          state.query = e.target.value;
          renderList(); renderTally(); markCurrent();
          if (state.mode === 'graph') draw();
        });
        // Escape clears the focus: an operator must always have one key that
        // returns them to the whole picture.
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && state.selected) select(state.selected);
        });
        // Resize is not one event. Rotating a phone, the address bar collapsing on
        // scroll, and the on-screen keyboard opening all fire it — iOS fires a
        // burst of them for a single rotation. This handler ran the FULL layout
        // each time: 420 iterations of an O(n^2) repulsion pass, on the main
        // thread.
        //
        // Worse than the cost: layout() re-seeds every position from the new
        // viewport, so an operator who had panned to a corner and opened the
        // keyboard came back to a different graph. The positions are not a
        // function of the viewport and should not be recomputed from it.
        //
        // So: debounce, and re-fit rather than re-layout. A refit keeps the
        // constellation and just frames it for the new box, which is what the
        // operator expects from a rotation. The graph is only laid out again when
        // its DATA or its node set changes — load() and setGraphTopics().
        let resizeTimer = null;
        window.addEventListener('resize', () => {
          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            resizeTimer = null;
            const box = svg.getBoundingClientRect();
            fit(box.width || 900, box.height || 560);
            draw();
          }, 150);
        });
      }

      // Scale to an absolute k about a fixed point. Pinch needs absolute rather
      // than relative scaling: a factor accumulated per move event drifts, while
      // "this much spread means this much zoom, measured from where the fingers
      // landed" does not.
      function zoomTo(target, cx, cy) {
        const k = clampScale(target);
        if (k === state.view.k) return;
        state.view.x = cx - (cx - state.view.x) * (k / state.view.k);
        state.view.y = cy - (cy - state.view.y) * (k / state.view.k);
        state.view.k = k;
        draw();
      }

      function zoomAt(factor, ox, oy) {
        const box = $('graph').getBoundingClientRect();
        const cx = ox === undefined ? (box.width || 900) / 2 : ox;
        const cy = oy === undefined ? (box.height || 560) / 2 : oy;
        // Keep the point under the cursor fixed while scaling.
        zoomTo(state.view.k * factor, cx, cy);
      }

      async function load() {
        const res = await call('/graph');
        if (!res.ok) {
          state.loading = false;
          state.error = (res.data && res.data.error) || `HTTP ${res.status}`;
          renderAll();
          return;
        }
        const d = res.data || {};
        state.facts = d.facts || [];
        state.entities = d.entities || [];
        state.edges = d.edges || [];
        state.stats = d.stats || null;
        state.isolatedIds = d.isolated_facts || [];
        state.error = null;
        state.loading = false;
        buildModel();
        const box = $('graph').getBoundingClientRect();
        layout(box.width || 900, box.height || 560);
        fitAll();
        renderAll();
        // The one authored moment, on the one transition that is not instant:
        // an empty console becoming a full one. Never on a filter, a sort or a
        // selection.
        if (!state.entered) {
          state.entered = true;
          $('stage').classList.add('enter');
        }
      }

      globalThis.__memory = {
        state, buildModel, layout, fit, fitAll, centreOn, draw, select, renderSide,
        renderScopes, renderSort, renderTally, renderNotice, renderList, renderLegend,
        renderAll, matches, matchesFact, matchesEntity, visible, neighbours, trustBand,
        trustWhy, shortLabel, factKey, entityKey, zoomAt, zoomTo, clampScale, csrf,
        call, load, setMode, applyMode, setGraphTopics, topicsOf, degreeOf, markCurrent,
        SCOPES, SORTS, TRUST_DEFAULT, TRUST_FLOOR, LINKING_MIN_FACTS,
      };

      wire();
      applyMode();
      renderAll();
      load();
    })();
  </script>
</body>
</html>
